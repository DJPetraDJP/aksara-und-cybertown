<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UFOZOMB</title>
<style>body{margin:0;background:#111;color:#eee;font-family:system-ui}.b{padding:2.5rem;text-align:center}</style>
</head><body><p class="b">Loading UFOZOMB…</p>
<script>
(async function(){
  try {
    var parts = await Promise.all([1,2,3,4,5,6,7].map(function(i){
      return fetch("ufozomb_gz_"+i+".txt").then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); });
    }));
    var b64 = parts.join("");
    var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    var ds = new DecompressionStream("gzip");
    var stream = new Response(bin).body.pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.body.innerHTML = "<p class=b>Load error: "+e+"</p>";
  }
})();
</script></body></html>
