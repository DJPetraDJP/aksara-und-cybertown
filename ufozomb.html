<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UFOZOMB</title>
  <style>
    body { margin: 0; background: #0a0612; color: #f5e6ea; font-family: system-ui, sans-serif; }
    .boot { padding: 2.5rem; text-align: center; opacity: 0.85; }
  </style>
</head>
<body>
  <p class="boot">Loading UFOZOMB…</p>
  <script src="ufozomb_b64_1.js"></script>
  <script src="ufozomb_b64_2.js"></script>
  <script src="ufozomb_b64_3.js"></script>
  <script src="ufozomb_b64_4.js"></script>
  <script src="ufozomb_b64_5.js"></script>
  <script src="ufozomb_b64_6.js"></script>
  <script src="ufozomb_b64_7.js"></script>
  <script>
  (function () {
    const parts = [];
    for (let i = 1; i <= 7; i++) {
      const p = window['__UFOZOMB_B64_' + i];
      if (p) parts.push(p);
    }
    if (!parts.length) {
      document.body.innerHTML = '<p class="boot">Data files missing. Open via GitHub Pages.</p>';
      return;
    }
    const bin = atob(parts.join(''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  })();
  </script>
</body>
</html>
