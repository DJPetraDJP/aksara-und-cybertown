<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Learn-Thai</title>
<style>body{margin:0;background:#f3efe6;color:#1c1914;font-family:system-ui}.b{padding:2.5rem;text-align:center}</style>
</head><body><p class="b">Loading Learn-Thai…</p>
<script>
(async function(){
  try {
    var n = 14;
    var parts = await Promise.all(Array.from({length:n},function(_,i){
      return fetch("learn-thai_gz_"+(i+1)+".txt").then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); });
    }));
    var b64 = parts.join("");
    var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    var ds = new DecompressionStream("gzip");
    var stream = new Response(bin).body.pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.body.innerHTML = "<p class=b>Load error: "+e+". Data still uploading.</p>";
  }
})();
</script></body></html>
